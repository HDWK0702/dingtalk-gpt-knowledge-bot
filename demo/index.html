<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>企业知识库问答 Demo</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "Microsoft YaHei", sans-serif; --ink:#17212b; --muted:#65717d; --line:#dfe5eb; --blue:#1d5fd1; --soft:#eef5ff; --green:#19734b; }
    * { box-sizing: border-box; }
    body { margin:0; color:var(--ink); background:#f5f7fa; }
    .shell { max-width:980px; margin:0 auto; padding:40px 20px 56px; }
    header { display:flex; justify-content:space-between; gap:20px; align-items:flex-start; margin-bottom:24px; }
    h1 { margin:0 0 8px; font-size:clamp(28px, 5vw, 44px); letter-spacing:0; }
    .lead { margin:0; color:var(--muted); line-height:1.7; max-width:680px; }
    .badge { border:1px solid #b8cdef; background:#fff; color:var(--blue); padding:8px 12px; border-radius:6px; white-space:nowrap; font-size:13px; }
    .layout { display:grid; grid-template-columns: minmax(0, 1fr) 280px; gap:18px; align-items:start; }
    .panel { background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 4px 18px rgba(23,33,43,.05); }
    .chat { min-height:520px; display:flex; flex-direction:column; }
    .messages { padding:22px; display:flex; flex-direction:column; gap:14px; flex:1; }
    .msg { max-width:86%; padding:13px 15px; border-radius:8px; line-height:1.65; white-space:pre-wrap; }
    .user { align-self:flex-end; background:var(--blue); color:#fff; }
    .bot { align-self:flex-start; background:var(--soft); border:1px solid #d4e3ff; }
    .source { margin-top:9px; padding-top:8px; border-top:1px solid #c9daf7; color:#315d9f; font-size:13px; }
    .composer { display:flex; gap:10px; border-top:1px solid var(--line); padding:14px; }
    input { flex:1; min-width:0; border:1px solid #bfc9d5; border-radius:6px; padding:12px; font-size:15px; }
    button { border:0; border-radius:6px; background:var(--blue); color:#fff; padding:0 18px; font-weight:600; cursor:pointer; }
    button:hover { background:#174da9; }
    .side { padding:18px; }
    .side h2 { margin:0 0 10px; font-size:17px; }
    .side p { margin:0 0 15px; color:var(--muted); line-height:1.6; font-size:14px; }
    .quick { display:grid; gap:8px; }
    .quick button { background:#fff; color:var(--blue); border:1px solid #b8cdef; padding:10px; text-align:left; font-weight:500; }
    .quick button:hover { background:var(--soft); }
    .metrics { margin-top:20px; border-top:1px solid var(--line); padding-top:14px; font-size:13px; color:var(--muted); line-height:1.8; }
    @media (max-width:760px) { header { display:block; } .badge { display:inline-block; margin-top:14px; } .layout { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div><h1>企业知识库问答</h1><p class="lead">一个面向企业资料的 RAG 问答体验：先定位业务域，再依据已发布资料回答，并展示可追溯来源。</p></div>
      <span class="badge">公开作品集 Demo · 虚构资料</span>
    </header>
    <div class="layout">
      <section class="panel chat" aria-label="问答演示">
        <div id="messages" class="messages">
          <div class="msg bot">你好，我可以回答产品服务和新人培训相关问题。你也可以试试右侧示例。</div>
        </div>
        <form id="composer" class="composer"><input id="question" autocomplete="off" placeholder="输入问题，例如：员工入职第一天需要做什么？"><button>发送</button></form>
      </section>
      <aside class="panel side">
        <h2>快速体验</h2>
        <p>这些问题对应不同业务域，能看到检索范围和来源如何变化。</p>
        <div class="quick">
          <button data-question="员工入职第一天需要做什么？">培训资料 · 入职清单</button>
          <button data-question="产品支持哪些服务？">产品资料 · 服务范围</button>
          <button data-question="系统能保证审批一定通过吗？">无依据问题 · 保守拒答</button>
          <button data-question="那遇到不会的问题怎么办？">上下文追问 · 承接上一题</button>
        </div>
        <div class="metrics">演示链路：问题分析 → 业务域过滤 → 资料检索 → 回答与来源<br>真实部署时由钉钉 Stream、FastAPI、Embedding 和大模型完成。</div>
      </aside>
    </div>
  </main>
  <script>
    const answers = {
      "员工入职第一天需要做什么？": ["新人第一天需要完成账号激活、阅读信息安全制度、参加部门介绍，并确认直属负责人和试用期目标。", "新人培训手册：入职第一天 · 入职清单"],
      "产品支持哪些服务？": ["示例产品支持资料查询、流程指引、常见问题解答；复杂问题可转交人工服务。", "产品服务说明 · 服务范围"],
      "系统能保证审批一定通过吗？": ["暂未找到可以保证审批结果的资料。系统不会编造审批承诺，建议联系负责人确认。", "知识库回答边界"],
      "那遇到不会的问题怎么办？": ["如果你是接着上一条培训问题追问：先查阅已发布资料；资料没有明确答案时，记录问题并联系直属负责人，不要自行对外承诺。", "新人培训手册：入职第一天 · 遇到不会的问题"]
    };
    const messages = document.querySelector('#messages');
    const input = document.querySelector('#question');
    function add(text, kind, source) { const node = document.createElement('div'); node.className = 'msg ' + kind; node.textContent = text; if (source) { const s = document.createElement('div'); s.className='source'; s.textContent='来源：' + source; node.appendChild(s); } messages.appendChild(node); messages.scrollTop = messages.scrollHeight; }
    function answer(question) { const hit = answers[question] || ["暂未找到可核实的答案。请联系知识库管理员补充资料。", "知识库回答边界"]; add(hit[0], 'bot', hit[1]); }
    document.querySelector('#composer').addEventListener('submit', e => { e.preventDefault(); const q=input.value.trim(); if (!q) return; add(q, 'user'); input.value=''; setTimeout(() => answer(q), 260); });
    document.querySelectorAll('[data-question]').forEach(button => button.addEventListener('click', () => { const q=button.dataset.question; add(q, 'user'); setTimeout(() => answer(q), 260); }));
  </script>
</body>
</html>
