services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    volumes:
      - ${OBSIDIAN_VAULT_PATH:-./knowledge}:/data/knowledge:ro
    depends_on:
      - redis
  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    env_file: .env
    restart: unless-stopped
    volumes:
      - ${OBSIDIAN_VAULT_PATH:-./knowledge}:/data/knowledge:ro
    ports:
      - "127.0.0.1:8000:8000"
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  redis_data:
